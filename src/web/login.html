<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>flux · 登录</title>
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e8edf5;--brand:#4f46e5;--cyan:#06b6d4;--bad:#ef4444}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#f6f8fc;display:grid;place-items:center;padding:20px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(720px 420px at 15% -10%,rgba(79,70,229,.10),transparent 60%),radial-gradient(620px 420px at 100% 100%,rgba(6,182,212,.10),transparent 60%)}
.card{position:relative;width:100%;max-width:390px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px 30px 28px;box-shadow:0 18px 50px rgba(15,23,42,.08);animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--cyan));display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 8px 22px rgba(79,70,229,.3);margin-bottom:20px}
h1{margin:0;font-size:21px;font-weight:750;letter-spacing:.3px}
p.sub{margin:6px 0 26px;color:var(--mut);font-size:13px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 7px}
.field{margin-bottom:16px}
input{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;padding:0 13px;font-size:14px;color:var(--ink);background:#fbfcfe;outline:none;transition:border-color .18s,box-shadow .18s;font-family:inherit}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.12);background:#fff}
button{width:100%;height:44px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--brand),#6366f1);color:#fff;font-size:14px;font-weight:650;cursor:pointer;transition:transform .15s,box-shadow .2s;font-family:inherit;box-shadow:0 7px 18px rgba(79,70,229,.25)}
button:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(79,70,229,.32)}
button:active{transform:translateY(0)}
button:disabled{opacity:.6;cursor:default;transform:none}
.err{margin-top:14px;font-size:12.5px;color:var(--bad);min-height:18px;text-align:center}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--mut);text-align:center;line-height:1.7}
@media(max-width:420px){.card{padding:28px 22px 22px;border-radius:18px}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">f</div>
  <h1>flux 控制台</h1>
  <p class="sub">登录后查看节点状态、流量与连接记录</p>
  <form id="f" autocomplete="off">
    <div class="field"><label for="u">用户名</label><input id="u" name="u" type="text" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">密码</label><input id="p" name="p" type="password" autocomplete="current-password" required></div>
    <button id="btn" type="submit">登 录</button>
  </form>
  <div class="err" id="err"></div>
  <div class="foot">会话有效期 24 小时 · 凭据来自配置文件 <code>web-auth</code><br>面板默认仅监听 127.0.0.1，请勿直接暴露到公网</div>
</div>
<script>
const f=document.getElementById('f'),btn=document.getElementById('btn'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{
  e.preventDefault();btn.disabled=true;err.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:document.getElementById('u').value,p:document.getElementById('p').value})});
    if(r.ok){location.href='/';return}
    let msg='用户名或密码错误';
    try{const j=await r.json();if(j.error)msg=j.error}catch(_){}
    err.textContent=msg;
  }catch(e){err.textContent='无法连接服务：'+e.message}
  btn.disabled=false;
});
</script>
</body>
</html>
