name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: v1.0.0)'
        required: true
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: flux-linux-x86_64
          - target: aarch64-unknown-linux-musl
            artifact: flux-linux-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # 同时更新 Cargo.toml 与 Cargo.lock 中 flux 包的版本，
      # 否则 --locked 会因 lock 文件需要更新而失败
      - name: Inject version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          V="${VERSION#v}"
          sed -i "/^name = \"flux\"\$/{n;s/^version = .*/version = \"${V}\"/}" Cargo.toml Cargo.lock
          grep -A1 '^name = "flux"$' Cargo.toml Cargo.lock

      - name: Build release
        run: cross build --release --target ${{ matrix.target }} --locked

      - name: Rename artifact
        run: |
          cp target/${{ matrix.target }}/release/flux ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Prepare Assets
        run: |
          mkdir -p release_assets
          cp dist/flux-* release_assets/
          cp config.example.yaml release_assets/config.example.yaml
          echo "Assets prepared:"
          ls -R release_assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: flux ${{ github.event.inputs.version }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.version, '-') }}
          generate_release_notes: true
          files: |
            release_assets/flux-*
            release_assets/config.example.yaml
