name: Build Flux Legacy x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build for legacy CPU
        env:
          RUSTFLAGS: "-C target-cpu=x86-64 -C target-feature=-bmi1,-bmi2,-avx,-avx2"
          CFLAGS: "-march=x86-64 -mtune=generic"
          CXXFLAGS: "-march=x86-64 -mtune=generic"
        run: |
          cargo build \
            --release \
            --target x86_64-unknown-linux-musl \
            --locked

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/flux dist/flux-linux-x86_64-legacy
          chmod +x dist/flux-linux-x86_64-legacy

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: flux-linux-x86_64-legacy
          path: dist/flux-linux-x86_64-legacy
          retention-days: 30
