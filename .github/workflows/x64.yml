name: x64 ci

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-x86_64

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: RUSTFLAGS="-C target-cpu=x86-64-v2" cargo build --release --target x86_64-unknown-linux-musl --locked

      - run: |
          mkdir dist
          mv target/x86_64-unknown-linux-musl/release/flux dist/flux-linux-x64-nn
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: dist/*
